name: Build, Test, Push to ECR, and Deploy to EC2

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gate - no third-party script/style CDNs
        run: |
          if grep -rnEi "<(script|link)[^>]+(src|href)=[\"']https?://" resources/views/; then
            echo "::error::Third-party CDN tag found (this is what made the site slow). Use Vite instead."
            exit 1
          fi

      - name: Set up PHP 8.4 (same as production)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, zip, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Gate - PHP syntax
        run: find app bootstrap config routes -type f -name "*.php" -exec php -l {} \; > /dev/null

      - name: Install PHP dependencies (with dev tools for the tests)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare app key
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: Gate - automated tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image (layer cache = much faster CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/auracinema:latest
            ${{ steps.login-ecr.outputs.registry }}/auracinema:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script_stop: true
          script: |
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/auracinema:$IMAGE_TAG"
            docker stop auracinema-app || true
            docker rm auracinema-app || true
            # All secrets (APP_KEY, DB_PASSWORD, ADMIN_*) live ONLY in this file on the server - never in git.
            docker run -d \
              --name auracinema-app \
              --restart always \
              --network host \
              --env-file /etc/auracinema/app.env \
              -v /var/auracinema/storage:/var/www/html/storage/app/public \
              "$ECR_REGISTRY/auracinema:$IMAGE_TAG"
            # fail the deploy if the new container does not become healthy
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' auracinema-app)" = "healthy" ] && echo "healthy" && break
              [ "$i" = "30" ] && docker logs --tail 50 auracinema-app && exit 1
              sleep 2
            done
            docker image prune -af --filter "until=72h"
