server {
    # Kept INSIDE the server block: Alpine's main nginx.conf already sets some of these at http level,
    # and the same directive twice in one block is a fatal error. Different blocks are fine.
    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    listen 80 default_server;
    listen [::]:80 default_server;

    client_max_body_size 40M;
    root /var/www/html/public;
    index index.php;

    # Hashed Vite assets never change -> cache for a year.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Uploaded posters / trailers. ^~ stops the PHP regex below from ever matching a file in here.
    # nginx serves mp4 with Range support out of the box, so seeking works.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;

        fastcgi_param HTTP_X_FORWARDED_PROTO $http_cloudfront_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}