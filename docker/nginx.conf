server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    # Plain-HTTP visitors of the public duckdns name are sent to HTTPS (served by Caddy on :443).
    # Requests via CloudFront or Caddy carry CloudFront-Forwarded-Proto, so they are left alone,
    # and the container health check (Host: 127.0.0.1) never matches.
    set $https_check "$host|$http_cloudfront_forwarded_proto";
    if ($https_check = "auracinema.duckdns.org|") {
        return 301 https://$host$request_uri;
    }

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Streamtape ඇතුළු සියලුම HTTPS embedded players නිදහසේ embed වීමට frame-src https: ලබා දීම
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; frame-src 'self' https: http: blob: data: https://*.youtube.com https://*.youtube-nocookie.com https://player.vimeo.com https://*.mediadelivery.net https://*.cloudflarestream.com https://*.videodelivery.net https://*.streamtape.com https://streamtape.com https://*.streamtape.to https://*.streamtape.net https://*.tapecontent.net https://*.adxtpe.com https://adxtpe.com; media-src 'self' blob: https: data:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:;";

    # nginx's default is 1 MB, which rejects any poster/trailer upload with "413 Request Entity Too Large".
    # Keep this just above PHP's post_max_size (40M) so PHP/Laravel can show its own friendly errors.
    client_max_body_size 45m;

    index index.php index.html index.htm;
    charset utf-8;

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        # Tell Laravel the visitor used HTTPS (CloudFront sends this header; the origin itself is plain HTTP).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_cloudfront_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}